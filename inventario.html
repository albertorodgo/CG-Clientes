function card(h, hist){
 var link = h.url ? '<a class="btn" href="'+h.url+'" target="_blank">Ver publicación →</a>' : '';
 var b = hist ? '<span class="badge">Por confirmar</span>' : '<span class="badge ok">Verificada</span>';
 var img = (!hist && h.foto && IMGS[h.foto]) ? '<div class="foto"><img src="'+IMGS[h.foto]+'" loading="lazy"></div>' : '';
 var wa = 'https://wa.me/528341213030?text='+encodeURIComponent('Hola, me interesa esta propiedad de CG Bienes Raíces: '+h.titulo+' ('+h.precio_txt+'). ¿Me das más información?');
 var wabtn = '<a class="btn wa" target="_blank" href="'+wa+'">📲 WhatsApp</a>';
 var sharebtn = h.url ? '<button class="btn share" onclick="copiarLink(''+h.url.replace(/'/g,"\'")+'',this)">🔗 Copiar link</button>' : '';
 return '<div class="card" data-op="'+h.op+'" data-tipo="'+h.tipo+'" data-q="'+(h.titulo+' '+h.specs+' '+h.precio_txt).toLowerCase()+'">'
 +img+'<div class="t">'+h.titulo+'</div><div class="p">'+h.precio_txt+'</div>'
 +'<div class="s">'+h.specs+'</div>'
 +'<div class="f"><span class="tag">'+h.op+' · '+h.tipo+'</span>'+b+'</div>'
 +'<div class="f btns">'+wabtn+sharebtn+'</div>'
 +'<div class="f">'+(h.fecha?'<span>'+h.fecha+'</span>':'<span></span>')+link+'</div></div>';
}
function copiarLink(url, btn){
 if(navigator.share){navigator.share({url:url}).catch(function(){});return;}
 navigator.clipboard.writeText(url).then(function(){
  var t=btn.textContent;btn.textContent='✓ Copiado';setTimeout(function(){btn.textContent=t;},1500);
 }).catch(function(){prompt('Copia el link:',url);});
}
function render(){
 document.getElementById('g-p').innerHTML = P.map(function(h){return card(h,false)}).join('');
 document.getElementById('g-h').innerHTML = H.map(function(h){return card(h,true)}).join('');
 document.getElementById('c-p').textContent = P.length;
 document.getElementById('c-h').textContent = H.length;
}
function show(s){
 document.getElementById('sec-p').classList.toggle('act', s=='p');
 document.getElementById('sec-h').classList.toggle('act', s=='h');
 document.getElementById('t1').classList.toggle('act', s=='p');
 document.getElementById('t2').classList.toggle('act', s=='h');
 filtrar();
}
function filtrar(){
 var q=document.getElementById('q').value.toLowerCase(), op=document.getElementById('fop').value, t=document.getElementById('ft').value;
 var secP=document.getElementById('sec-p').classList.contains('act');
 var grid=secP?document.getElementById('g-p'):document.getElementById('g-h');
 var n=0, total=grid.querySelectorAll('.card').length;
 grid.querySelectorAll('.card').forEach(function(c){
  var okq=!q||c.dataset.q.indexOf(q)>=0, oko=!op||c.dataset.op.indexOf(op)>=0, okt=!t||c.dataset.tipo==t;
  var vis=okq&&oko&&okt;
  c.style.display=vis?'':'none';
  if(vis)n++;
 });
 var nom=secP?'destacadas':'del histórico';
 var el=document.getElementById('conteo');
 if(!q&&!op&&!t){el.innerHTML='Mostrando <b>'+total+'</b> propiedades '+nom;}
 else{el.innerHTML='<b>'+n+'</b> de '+total+' propiedades '+nom+' con este filtro';}
}
render();
</script></body></html>
